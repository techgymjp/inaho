<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>水田365日</title>
  <meta name="description" content="福島の山あいの田んぼの一年を、1日1分で。収穫の時だけスワイプで稲を刈り取る3D風景シミュレーション。">
  <meta name="theme-color" content="#1b2418">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f2a1a'/%3E%3Cpath d='M32 56V22' stroke='%23d9b44a' stroke-width='3'/%3E%3Cpath d='M32 24c6-8 14-10 18-8-2 6-10 10-18 8zM32 32c-6-8-14-10-18-8 2 6 10 10 18 8zM32 40c6-8 14-10 18-8-2 6-10 10-18 8z' fill='%23e8c55a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }
  </script>
</head>
<body class="title loading">
  <canvas id="scene"></canvas>
  <script>
    // 読み込み中やエラーをタイトル画面に表示する（ボタンが効かない原因を見つけやすくするため）
    window.addEventListener('error', function (e) {
      var el = document.getElementById('bootError');
      if (el) { el.hidden = false; el.textContent = 'Error: ' + (e.message || e.type) + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''); }
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var el = document.getElementById('bootError');
      if (el) { el.hidden = false; el.textContent = 'Error: ' + (e.reason && e.reason.message || e.reason); }
    });
  </script>
  <canvas id="trail"></canvas>

  <div id="yearTrack"><div id="yearBar"></div>
    <i style="left:36.7%" title="田植え"></i><i style="left:72.3%" title="稲刈り"></i>
  </div>

  <header id="hud">
    <div id="hudYear">1年目</div>
    <div id="hudDate">—</div>
    <div class="row"><span id="hudTime">--:--</span><span id="hudSub"></span></div>
  </header>

  <section id="stageCard">
    <div id="stageName"></div>
    <div id="stageNote"></div>
  </section>

  <section id="harvestPanel">
    <div class="tag work" data-i18n="tag.work">農作業イベント（あなたの作業）</div>
    <div class="hTop"><span><span id="hLabel">刈り取り</span> <b id="hPct">0%</b></span><span id="hKg">0 kg</span></div>
    <div class="hBar"><div id="hFill"></div></div>
    <div class="hBottom"><span id="hGrade"></span></div>
  </section>

  <div id="swipeHint" data-i18n="harvest.hint">田んぼの稲を指でなぞって刈り取る</div>
  <div id="toast"></div>

  <nav id="controls">
    <button id="btnPause" title="一時停止（Space）">❚❚</button>
    <button id="btnView" title="視点を切り替え（V）">視点</button>
    <button id="btnSound">音：オフ</button>
  </nav>

  <div id="start" class="overlay show">
    <div class="startInner">
      <p class="pre" data-i18n="title.pre">福島・山あいの田んぼより</p>
      <h1>水田<span>365</span>日</h1>
      <p class="lead" data-i18n="title.lead">山に囲まれた田んぼの一年を、<br>一日一分で見守る。</p>
      <p class="lead small" data-i18n="title.lead2">雪どけ、水張り、田植え、黄金の穂。<br>稲刈りのときだけ、あなたの手で。</p>
      <p class="best" id="bestRecord" hidden></p>
      <div class="buttons">
        <button data-start="continue" id="btnContinue" hidden class="primary"><span data-i18n="start.continue">つづきから</span></button>
        <button data-start="today" id="btnToday" class="primary"><span data-i18n="start.today">今日の日付から始める</span><small id="todayLabel"></small></button>
        <button id="btnHowto" data-i18n="menu.howto">あそびかた</button>
      </div>
      <p class="tiny" data-i18n="start.tiny">1日およそ1分（昼はゆっくり、夜は速く）。音が出ます。</p>
      <p class="loadingNote" data-i18n="loading">読み込み中…</p>
      <p class="tiny bootError" id="bootError" hidden></p>
      <p class="tiny footer"><span id="appVersion"></span> ・ <a id="privacyLink" href="https://techgym.jp/privacy-policy/" target="_blank" rel="noopener" data-i18n="privacy">プライバシーポリシー</a><span id="adPrivacy" hidden> ・ <a href="#" id="adPrivacyLink" data-i18n="adPrivacy">広告の設定</a></span></p>
    </div>
  </div>

  <div id="menu" class="overlay">
    <div class="panel">
      <h2 data-i18n="pause.title">一時停止</h2>
      <h2 class="sub" data-i18n="menu.records">収穫の記録</h2>
      <table><tbody id="records"></tbody></table>
      <div class="buttons">
        <button id="btnCloseMenu" class="primary" data-i18n="pause.resume">再開する</button>
        <button id="btnPauseHowto" data-i18n="menu.howto">あそびかた</button>
        <button id="btnQuality"></button>
        <button id="btnLang"></button>
        <button id="btnToTitle" data-i18n="toTitle">タイトルに戻る</button>
        <button id="btnReset" class="danger" data-i18n="menu.reset">最初からやり直す</button>
      </div>
    </div>
  </div>

  <div id="howto" class="overlay">
    <div class="panel">
      <h2 data-i18n="menu.howto">あそびかた</h2>
      <ul>
        <li data-i18n="howto.1"></li>
        <li data-i18n="howto.2"></li>
        <li data-i18n="howto.3"></li>
        <li data-i18n="howto.4"></li>
        <li data-i18n="howto.5"></li>
        <li data-i18n="howto.6"></li>
        <li data-i18n="howto.7"></li>
        <li data-i18n="howto.8"></li>
      </ul>
      <div class="buttons">
        <button id="btnHowtoPlay" class="primary" data-i18n="howto.play">プレイする</button>
        <button id="btnHowtoBack" data-i18n="back">戻る</button>
      </div>
    </div>
  </div>

  <div id="rewardAsk" class="overlay">
    <div class="panel event">
      <div class="tag work big" id="rwTag">稲刈りの期限です</div>
      <h2 id="rwTitle">まだ稲が残っています</h2>
      <p id="rewardText"></p>
      <div class="buttons">
        <button id="btnRewardYes" class="primary"><span id="rwYes">広告を見て3日延ばす</span><small id="rewardCount"></small></button>
        <button id="btnRewardNo" data-i18n="reward.no">あきらめる</button>
      </div>
    </div>
  </div>

  <div id="eventCard" class="overlay">
    <div class="panel event">
      <div class="tag work big" data-i18n="tag.workStart">農作業イベント　あなたの出番です</div>
      <h2 id="evTitle"></h2>
      <div class="evRow"><span class="evKey" data-i18n="ev.todo">やること</span><p id="evTodo"></p></div>
      <div class="evRow"><span class="evKey" data-i18n="ev.effect">結果への影響</span><p id="evEffect"></p></div>
      <div class="evRow"><span class="evKey" data-i18n="ev.when">期間</span><p id="evWhen"></p></div>
      <div class="buttons"><button id="btnEvStart" class="primary" data-i18n="ev.start">はじめる</button></div>
    </div>
  </div>

  <div id="result" class="overlay">
    <div class="panel">
      <h2 data-i18n="result.title">今年の収穫</h2>
      <div id="resultBody"></div>
      <div class="buttons">
        <button id="btnCloseResult" class="primary" data-i18n="result.back">田んぼへ戻る</button>
        <button id="btnShare" data-i18n="share">結果をシェア</button>
        <button id="btnResultTitle" data-i18n="toTitle">タイトルに戻る</button>
      </div>
    </div>
  </div>

  <noscript>このゲームを遊ぶには JavaScript と WebGL が必要です。</noscript>
  <!-- web-only -->
  <style>
    /* スマホの縦画面（Web 版）：なぞり方の案内は、右下の作業パネルのすぐ上に1行で出す */
    @media (max-width: 560px) {
      #swipeHint { left: 50%; right: auto; transform: translateX(-50%); max-width: calc(100vw - 32px);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        bottom: calc(16px + var(--panelH, 120px) + 10px + env(safe-area-inset-bottom)); }
    }
  </style>
  <script>
    // 作業パネルの高さに合わせて、案内をその上に置く
    (function () {
      var p = document.getElementById('harvestPanel');
      if (!p || !window.ResizeObserver) return;
      new ResizeObserver(function () { document.documentElement.style.setProperty('--panelH', p.offsetHeight + 'px'); }).observe(p);
    })();
  </script>
  <!-- /web-only -->
  <script src="js/ads-config.js"></script>
  <script src="js/build-info.js"></script>
  <script src="js/ads.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
